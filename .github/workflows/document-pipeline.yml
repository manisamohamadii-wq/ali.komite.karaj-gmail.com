name: Document processing (safe)

on:
  workflow_dispatch:
  push:
    paths:
      - 'documents/incoming/**'
      - 'scripts/document_pipeline.py'
      - '.github/workflows/document-pipeline.yml'

permissions:
  contents: read

jobs:
  process-documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-fas

      - name: Run OCR, extraction, inventory and print-ready export
        run: python3 scripts/document_pipeline.py --input documents/incoming --output artifacts/document-run

      - name: Upload processing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: document-processing-${{ github.run_number }}
          path: artifacts/document-run
          if-no-files-found: error
          retention-days: 14
